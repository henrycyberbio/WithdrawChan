[project]
name = "lab"
version = "1.0.0"
description = "Reproducible experiments on withdrawal-amount privacy in privacy pools"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["withdrawchan", "fire>=0.7", "numpy>=2.3", "matplotlib>=3.10"]

[project.scripts]
lab = "lab.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
withdrawchan = { path = "../src/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
