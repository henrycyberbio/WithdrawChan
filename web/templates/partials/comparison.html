{% set messages = load_data(path="data/messages.json") %}<section id="privacy-comparison" class="privacy-comparison" aria-labelledby="privacy-heading">
<div class="privacy-heading chart-heading"><div class="chart-heading-copy"><p class="comparison-eyebrow">WITHDRAWCHAN / 01</p><h3 id="privacy-heading" data-i18n="privacyHeading">{{ messages.en.privacyHeading }}</h3></div><ul class="chart-legend"><li><i class="legend-swatch baseline" aria-hidden="true"></i><span data-i18n="privacyBaseline">{{ messages.en.privacyBaseline }}</span></li><li><i class="legend-swatch drain" aria-hidden="true"></i><span data-i18n="privacyDrain">{{ messages.en.privacyDrain }}</span></li><li><i class="legend-swatch partial" aria-hidden="true"></i><span data-i18n="privacyPartial">{{ messages.en.privacyPartial }}</span></li></ul></div>

ar-height:81.000%"><span class="bar-value">9.72</span></div></div><span class="chart-pool-name">ETH**</span></div></div></div></div>
<table class="chart-accessible"><caption data-i18n="chartTableCaption">{{ messages.en.chartTableCaption }}</caption><thead><tr><th scope="col" data-i18n="chartPool">{{ messages.en.chartPool }}</th><th scope="col" data-i18n="privacyBaseline">{{ messages.en.privacyBaseline }}</th><th scope="col" data-i18n="privacyDrain">{{ messages.en.privacyDrain }}</th><th scope="col" data-i18n="privacyPartial">{{ messages.en.privacyPartial }}</th></tr></thead><tbody><tr><th scope="row">USDT*</th><td>1.34 bits</td><td>3.58 bits</td><td>6.01 bits</td></tr><tr><th scope="row">USDC*</th><td>1.57 bits</td><td>3.82 bits</td><td>7.65 bits</td></tr><tr><th scope="row">ETH**</th><td>2.28 bits</td><td>4.85 bits</td><td>9.72 bits</td></tr></tbody></table>
<figcaption id="privacy-note" class="privacy-note" data-i18n="privacyNote">{{ messages.en.privacyNote }}</figcaption></figure></section>
