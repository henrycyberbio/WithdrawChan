{% set messages = load_data(path="data/messages.json") %}<div class="tool-screen"><section class="input-section" aria-labelledby="input-title"><p class="eyebrow" data-i18n="eyebrow">{{ messages.en.eyebrow }}</p><h1 id="input-title" data-i18n="title">{{ messages.en.title }}</h1><form id="form" class="glass-panel" novalidate><div class="pool-row"><label for="asset" data-i18n="poolLabel">{{ messages.en.poolLabel }}</label><div class="pool-actions"><a class="protocol-button" href="https://privacypools.com/" target="_blank" rel="noopener noreferrer">Privacy Pools<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3h8v8M13 3 3 13"/></svg></a><select id="asset"><option value="USD-stable" selected>USD-stable</option><option value="ETH">ETH</option></select></div></div><div class="range"><div class="field"><label for="minimum" data-i18n="needed">{{ messages.en.needed }}</label><div class="input-line"><input id="minimum" type="text" inputmode="decimal" aria-describedby="range-limit" value="" placeholder="0" required><span data-asset-unit>USD</span></div></div><span class="range-dash" aria-hidden="true">—</span><div class="field"><label for="maximum" data-i18n="maximum">{{ messages.en.maximum }}</label><div class="input-line"><input id="maximum" type="text" inputmode="decimal" aria-describedby="range-limit" value="" placeholder="0"><span data-asset-unit>USD</span></div></div></div><div class="form-bottom"><span id="range-limit" data-i18n="limit">{{ messages.en.limit }}</span><button id="recommend" class="primary" type="submit"><span data-i18n="calculate">{{ messages.en.calculate }}</span><span aria-hidden="true">✦</span></button></div><p class="error" id="error" role="alert"></p></form></section>
<section class="output-section" aria-labelledby="result-label"><div class="result glass-panel" aria-live="polite"><div class="result-heading"><h2 id="result-label" data-i18n="playful">{{ messages.en.playful }}</h2></div><div class="amount"><span id="value">—</span><span class="unit" data-asset-unit>USD</span><button id="copy-amount" class="copy-amount" type="button" aria-label="{{ messages.en.copyAmountLabel }}" title="{{ messages.en.copyAmountLabel }}" disabled><svg class="copy-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/></svg><svg class="check-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg></button><span id="copy-status" class="sr-only" role="status" aria-live="polite"></span></div><p id="result-hint" class="result-hint" data-i18n="hintPlayful">{{ messages.en.hintPlayful }}</p><p id="range-note" class="range-note sr-only"></p></div></section><a class="scroll-cue" href="#privacy-comparison"><span data-i18n="scrollCompare">{{ messages.en.scrollCompare }}</span><span aria-hidden="true">↓</span></a></div>
